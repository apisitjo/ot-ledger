<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>สลิปค่าแรง OT รายปี</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12181f; --panel:#1b242f; --panel-2:#212c38;
    --paper:#eae4d8; --paper-dim:#a9a294;
    --gold:#d3a24f; --teal:#5ba39b; --coral:#c26b5f;
    --rule:rgba(234,228,216,0.14);
    --work-red:#c0524a; --off-blue:#5b8fc7; --vac-green:#5fae6a;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);color:var(--paper);font-family:'IBM Plex Sans Thai',sans-serif;padding:28px 18px 70px;}
  .wrap{max-width:1040px;margin:0 auto;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;margin:0 0 8px;}
  h1{font-family:'Noto Serif Thai',serif;font-weight:700;font-size:clamp(26px,4vw,38px);margin:0 0 4px;}
  .sub{color:var(--paper-dim);font-size:13px;margin:0 0 22px;}

  /* Settings */
  details.settings{background:var(--panel);border:1px solid var(--rule);border-radius:6px;margin-bottom:22px;padding:0;}
  details.settings summary{cursor:pointer;padding:12px 16px;font-size:13px;color:var(--gold);font-weight:600;list-style:none;}
  details.settings summary::-webkit-details-marker{display:none;}
  .settings-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;padding:0 16px 16px;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:11px;color:var(--paper-dim);}
  .field input{
    background:var(--panel-2);border:1px solid var(--rule);color:var(--paper);
    border-radius:4px;padding:6px 8px;font-family:'IBM Plex Mono',monospace;font-size:13px;width:100%;
  }

  /* Tabs */
  .tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:22px;padding-bottom:4px;}
  .tab{
    flex:0 0 auto;background:var(--panel);border:1px solid var(--rule);color:var(--paper-dim);
    font-family:'IBM Plex Mono',monospace;font-size:12px;padding:8px 14px;border-radius:20px;cursor:pointer;white-space:nowrap;
  }
  .tab.active{background:var(--gold);color:#1a1408;border-color:var(--gold);font-weight:600;}
  .tab.overview{border-color:var(--teal);}
  .tab.overview.active{background:var(--teal);color:#0d201e;}

  .hero{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:28px;}
  .stamp{flex:1 1 200px;background:var(--panel);border:1px solid var(--rule);border-radius:2px;padding:16px 18px;position:relative;}
  .stamp::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;}
  .stamp.gross::before{background:var(--gold);}
  .stamp.ded::before{background:var(--coral);}
  .stamp.net::before{background:var(--teal);}
  .stamp .label{font-size:11px;color:var(--paper-dim);letter-spacing:.05em;margin-bottom:6px;}
  .stamp .num{font-family:'IBM Plex Mono',monospace;font-size:23px;font-weight:600;}
  .stamp .num small{font-size:12px;color:var(--paper-dim);font-weight:400;}

  .section-title{font-family:'Noto Serif Thai',serif;font-size:15px;font-weight:700;margin:0 0 12px;padding-bottom:7px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:baseline;}
  .section-title .hint{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--paper-dim);font-weight:400;}

  .cal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px;margin-bottom:8px;}
  .day{background:var(--panel);border:2px solid var(--rule);border-radius:4px;padding:6px 6px 8px;display:flex;flex-direction:column;gap:4px;}
  .day.work{border-color:var(--work-red);}
  .day.off{border-color:var(--off-blue);opacity:.75;}
  .day.vacation{border-color:var(--vac-green);}
  .day.vacation-half{border-color:var(--paper);border-style:dashed;}
  .day.personal{border-color:var(--coral);}
  .day.off-ot{border-color:var(--gold);border-style:dashed;}
  .day .d{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--paper-dim);}
  .day select{width:100%;background:var(--panel-2);color:var(--paper);border:1px solid var(--rule);border-radius:3px;font-size:10px;padding:2px;font-family:'IBM Plex Sans Thai',sans-serif;}
  .otgrid{display:flex;gap:3px;}
  .day input{width:100%;background:var(--panel-2);color:var(--gold);border:1px solid var(--rule);border-radius:3px;font-size:11px;padding:3px 2px;font-family:'IBM Plex Mono',monospace;text-align:center;min-width:0;}
  .day input:disabled{opacity:.25;}
  .legend{display:flex;gap:16px;margin:6px 0 26px;font-size:11px;color:var(--paper-dim);flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .swatch{width:10px;height:10px;border-radius:2px;display:inline-block;}
  .daycounts{display:flex;gap:18px;font-size:12px;color:var(--paper-dim);margin-bottom:22px;font-family:'IBM Plex Mono',monospace;}
  .daycounts b{color:var(--paper);}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-bottom:30px;}
  @media(max-width:640px){.cols{grid-template-columns:1fr;} .cal-grid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));}}
  .fieldset-title{font-size:12px;color:var(--paper-dim);margin:14px 0 8px;}

  .bar-row{margin-bottom:12px;}
  .bar-row .top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;}
  .bar-row .top .amt{font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .bar-track{height:7px;background:var(--panel-2);border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:4px;}

  /* overview table */
  table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:28px;}
  th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--rule);font-family:'IBM Plex Mono',monospace;}
  th:first-child,td:first-child{text-align:left;font-family:'IBM Plex Sans Thai',sans-serif;}
  thead th{color:var(--paper-dim);font-weight:500;font-size:11px;}
  tr.total td{font-weight:700;color:var(--gold);border-top:2px solid var(--rule);border-bottom:none;}

  .ybar-wrap{display:flex;align-items:flex-end;gap:10px;height:180px;margin-bottom:10px;overflow-x:auto;padding-bottom:4px;}
  .ybar-col{flex:0 0 56px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:2px;}
  .ybar{width:22px;border-radius:2px 2px 0 0;}
  .ybar.g{background:var(--gold);}
  .ybar.d{background:var(--coral);}
  .ybar-pair{display:flex;gap:3px;align-items:flex-end;height:140px;}
  .ybar-lbl{font-size:10px;color:var(--paper-dim);font-family:'IBM Plex Mono',monospace;}

  .footnote{margin-top:20px;padding-top:14px;border-top:1px solid var(--rule);font-size:11px;color:var(--paper-dim);line-height:1.7;}
  .reset-btn{background:none;border:1px solid var(--coral);color:var(--coral);font-size:11px;padding:6px 12px;border-radius:20px;cursor:pointer;font-family:'IBM Plex Mono',monospace;}

  .donut-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:8px;}
  .donut-cols .donut-card:nth-child(3){grid-column:1 / -1;}
  .donut-card{background:var(--panel-2);border:1px solid var(--rule);border-radius:8px;padding:14px 16px 16px;}
  .donut-card .section-title{margin-bottom:10px;}
  @media(max-width:820px){.donut-cols{grid-template-columns:1fr;} .donut-cols .donut-card:nth-child(3){grid-column:auto;}}
  .donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:8px;}
  .donut{width:130px;height:130px;border-radius:50%;position:relative;flex:0 0 auto;background:var(--panel-2);}
  .donut::after{content:'';position:absolute;inset:16px;background:var(--ink);border-radius:50%;}
  .donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;z-index:1;}
  .donut-center .pct{font-size:18px;font-weight:600;color:var(--gold);}
  .donut-center .lbl{font-size:9px;color:var(--paper-dim);letter-spacing:.04em;text-align:center;}
  .donut-legend{font-size:12px;}
  .donut-legend div{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Overtime &amp; Payroll Ledger — Yearly</p>
  <h1>สรุปค่าแรง OT รายปี</h1>
  <p class="sub">งวดเงินเดือนแบบ 16 ของเดือน ถึง 15 ของเดือนถัดไป · แก้ไขได้ทุกช่อง ข้อมูลจะถูกบันทึกไว้ในเบราว์เซอร์นี้อัตโนมัติ</p>

  <details class="settings">
    <summary>🔗 ซิงก์ข้อมูลออนไลน์ (Google Sheet ผ่าน Apps Script)</summary>
    <div class="settings-body" style="grid-template-columns:1fr;">
      <div class="field">
        <label>Web App URL (จากการ Deploy Apps Script)</label>
        <input type="text" id="syncUrl" value="https://script.google.com/macros/s/AKfycbxDqPirey0l5noIAjCctgu1kwBCo6BXuwPP8G8yRsgI2ltNZwB-HgstecBZDeIIyUbe/exec" placeholder="https://script.google.com/macros/s/xxxx/exec">
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <button class="reset-btn" id="syncSaveBtn" style="border-color:var(--teal);color:var(--teal);">บันทึก URL &amp; ซิงก์</button>
        <button class="reset-btn" id="syncPushBtn">อัปโหลดข้อมูลเครื่องนี้ขึ้น Sheet</button>
        <span id="syncStatus" style="font-size:11px;color:var(--paper-dim);font-family:'IBM Plex Mono',monospace;">ยังไม่เชื่อมต่อ</span>
      </div>
    </div>
  </details>

  <div class="tabs" id="tabs"></div>

  <div id="content"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const MONTH_TH = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const STORE_KEY = "ot_ledger_state_v1";
const YEAR = 2026;

function daysInMonth(m,y){ return new Date(y, m+1, 0).getDate(); }

function defaultExtra(){
  return {salary:0, baseWage:5000, col:1050, shift:0, diligence:800, car:0,
          tax:0, sso:875, fund:1364, kss:1179, other2:800, other3:150};
}

function defaultRates(){
  return {ot15:178.23, ot2:237.65, ot3:356.47, meal:63, mealot:30, moto:90, car:90};
}

function periodDays(m, y){
  const list = [];
  const endM = daysInMonth(m, y);
  for(let d=16; d<=endM; d++) list.push({month:m, year:y, day:d});
  const nm = (m+1)%12, ny = (m===11) ? y+1 : y;
  for(let d=1; d<=15; d++) list.push({month:nm, year:ny, day:d});
  return list;
}
function dayKey(dd){ return `${dd.year}-${dd.month}-${dd.day}`; }

function decDefaults(){
  // historical sample data for the ธันวาคม(11) period, as given by the user's original sheet
  const otMap = {16:2.3,17:0,18:2,19:'off',20:'off',21:2.3,22:0,23:2.3,24:0,25:1.5,
    26:'off',27:'off',28:'off',29:'off',30:'off',31:'off',1:'off',2:'off',3:'off',
    4:2.3,5:0,6:2.3,7:0,8:1.5,9:'off',10:'off',11:2.3,12:0,13:2.3,14:0,15:1.5};
  const days = {};
  periodDays(11, YEAR).forEach(dd=>{
    const raw = otMap[dd.day];
    days[dayKey(dd)] = raw==='off' ? {type:'off', ot15:0, ot2:0, ot3:0} : {type:'work', ot15: raw||0, ot2:0, ot3:0, vehicle:'moto'};
  });
  const extra = defaultExtra();
  return {days, extra, rates: defaultRates()};
}

function emptyMonth(m){
  const days = {};
  periodDays(m, YEAR).forEach(dd=>{ days[dayKey(dd)] = {type:'work', ot15:0, ot2:0, ot3:0, vehicle:'moto'}; });
  return {days, extra: defaultExtra(), rates: defaultRates()};
}

function migrateState(s){
  // เติม/ซ่อมโครงสร้างข้อมูลให้ครบสคีมาปัจจุบันเสมอ ไม่ว่าจะมาจาก localStorage หรือดึงจาก Google Sheet
  if(!s || typeof s !== 'object') s = {};
  if(!s.months) s.months = {};
  for(let m=0;m<12;m++){
    if(!s.months[m]) s.months[m] = (m===11) ? decDefaults() : emptyMonth(m);
  }
  Object.values(s.months).forEach(ms=>{
    if(!ms.days) ms.days = {};
    Object.values(ms.days).forEach(d=>{
      if(d.ot15===undefined){ d.ot15 = d.ot||0; delete d.ot; }
      if(d.ot2===undefined) d.ot2 = 0;
      if(d.ot3===undefined) d.ot3 = 0;
      if(d.vehicle===undefined) d.vehicle = 'moto';
    });
    if(!ms.extra) ms.extra = defaultExtra();
    else { delete ms.extra.ot2h; delete ms.extra.ot3h; if(ms.extra.salary===undefined) ms.extra.salary = 0; }
    // migrate: อัตราค่าแรงเคยใช้ร่วมกันทุกเดือน (s.rates) -> ตอนนี้แยกเก็บต่อเดือน
    if(!ms.rates){ ms.rates = s.rates ? {...s.rates} : defaultRates(); }
  });
  delete s.rates; // เลิกใช้อัตรากลาง
  return s;
}

function loadState(){
  const saved = localStorage.getItem(STORE_KEY);
  if(saved){
    try{
      return migrateState(JSON.parse(saved));
    }catch(e){}
  }
  const months = {};
  for(let m=0;m<12;m++){ months[m] = (m===11) ? decDefaults() : emptyMonth(m); }
  return { months };
}
let state = loadState();
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); scheduleRemotePush(); }

/* ---------- Google Sheet sync (via Apps Script Web App) ---------- */
const SYNC_URL_KEY = "ot_sync_url";
function getSyncUrl(){ return localStorage.getItem(SYNC_URL_KEY) || ""; }
function setSyncUrl(u){ localStorage.setItem(SYNC_URL_KEY, u); }
function nowTimeStr(){ return new Date().toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'}); }
function setSyncStatus(text){ const el = document.getElementById('syncStatus'); if(el) el.textContent = text; }

async function fetchRemoteState(url){
  const res = await fetch(url, {method:'GET'});
  if(!res.ok) throw new Error('bad status '+res.status);
  const data = await res.json();
  if(data && typeof data === 'object' && data.months) return data;
  return null; // sheet empty / not yet initialized
}

async function pushRemoteState(url, stateObj){
  const res = await fetch(url, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, // avoids CORS preflight on Apps Script
    body: JSON.stringify(stateObj)
  });
  if(!res.ok) throw new Error('bad status '+res.status);
  return res.json();
}

let pushTimer = null;
function scheduleRemotePush(){
  const url = getSyncUrl();
  if(!url) return;
  clearTimeout(pushTimer);
  setSyncStatus('กำลังบันทึกขึ้น Sheet...');
  pushTimer = setTimeout(()=>{
    pushRemoteState(url, state)
      .then(()=> setSyncStatus('ซิงก์ล่าสุด: '+nowTimeStr()))
      .catch(()=> setSyncStatus('บันทึกขึ้น Sheet ไม่สำเร็จ (บันทึกในเครื่องนี้แล้ว) — เช็ค URL/อินเทอร์เน็ต'));
  }, 900);
}

async function pullRemoteOnLoad(){
  const url = getSyncUrl();
  if(!url) return;
  setSyncStatus('กำลังโหลดจาก Sheet...');
  try{
    const remote = await fetchRemoteState(url);
    if(remote){
      state = migrateState(remote);
      render();
      setSyncStatus('ซิงก์ล่าสุด: '+nowTimeStr());
    } else {
      // sheet ยังว่างอยู่ -> อัปโหลดข้อมูลเครื่องนี้ขึ้นไปตั้งต้น
      await pushRemoteState(url, state);
      setSyncStatus('Sheet ว่าง — อัปโหลดข้อมูลเครื่องนี้ขึ้นเป็นชุดแรกแล้ว');
    }
  }catch(err){
    setSyncStatus('เชื่อมต่อไม่สำเร็จ (ใช้ข้อมูลในเครื่องนี้แทน) — เช็ค URL');
  }
}

function attachSyncHandlers(){
  const input = document.getElementById('syncUrl');
  const saveBtn = document.getElementById('syncSaveBtn');
  const pushBtn = document.getElementById('syncPushBtn');
  if(!input) return;
  const saved = getSyncUrl();
  if(saved){
    input.value = saved; // ผู้ใช้เคยตั้ง/แก้ไข URL เองแล้ว ให้ยึดตามนั้น
  } else if(input.value.trim()){
    setSyncUrl(input.value.trim()); // ใช้ URL ที่ฝังมากับไฟล์เป็นค่าเริ่มต้นครั้งแรก
  }
  if(getSyncUrl()) setSyncStatus('พร้อมซิงก์ — กำลังตรวจสอบ...');
  saveBtn.onclick = ()=>{
    const u = input.value.trim();
    setSyncUrl(u);
    if(u) pullRemoteOnLoad();
    else setSyncStatus('ยังไม่เชื่อมต่อ');
  };
  pushBtn.onclick = async ()=>{
    const u = getSyncUrl();
    if(!u){ setSyncStatus('กรุณาใส่ URL แล้วกด "บันทึก URL & ซิงก์" ก่อน'); return; }
    setSyncStatus('กำลังอัปโหลด...');
    try{ await pushRemoteState(u, state); setSyncStatus('อัปโหลดขึ้น Sheet แล้ว: '+nowTimeStr()); }
    catch(err){ setSyncStatus('อัปโหลดไม่สำเร็จ — เช็ค URL/อินเทอร์เน็ต'); }
  };
}

let activeTab = 11; // start on December like the original file, 'overview' for summary

function calcMonth(m){
  const ms = state.months[m];
  const r = ms.rates;
  let workDays=0, otDays=0, ot15Hours=0, ot2Hours=0, ot3Hours=0, offDays=0, vacDays=0, persDays=0;
  let offOtDays=0, vacHalfDays=0, otHolidayDays=0;
  let carDays=0, motoDays=0;
  Object.values(ms.days).forEach(d=>{
    if(d.type==='work' || d.type==='off_ot'){
      const h15=Number(d.ot15||0), h2=Number(d.ot2||0), h3=Number(d.ot3||0);
      // ค่าอาหาร OT นับเฉพาะวัน "ทำงาน" ปกติที่มี OT เท่านั้น — วันหยุด-ทำ OT ไม่นับรวมค่าอาหาร OT (ได้แค่ค่าอาหารปกติ)
      if(d.type==='work'){ workDays++; if(h15>0 || h2>0 || h3>0) otDays++; }
      else { offOtDays++; if(h3>0) otHolidayDays++; } // วันหยุด-ทำ OT: มี OT3 (3 เท่า) เท่านั้นถึงจะนับเป็นค่าอาหาร OT วันหยุด (OT2 อย่างเดียวยังได้แค่ค่าอาหารปกติ)
      ot15Hours+=h15; ot2Hours+=h2; ot3Hours+=h3;
      if(d.vehicle==='car') carDays++; else motoDays++;
    }
    else if(d.type==='vacation_half'){
      vacHalfDays++;
      if(d.vehicle==='car') carDays++; else motoDays++;
    }
    else if(d.type==='off') offDays++;
    else if(d.type==='vacation') vacDays++;
    else if(d.type==='personal') persDays++;
  });
  const ex = ms.extra;
  const ot15baht = ot15Hours*r.ot15, ot2baht = ot2Hours*r.ot2, ot3baht = ot3Hours*r.ot3;
  // วันหยุดที่มาทำ OT (off_ot) และพักร้อนครึ่งวัน (vacation_half) ได้ค่าอาหาร/ค่ารถ-มอไซค์ปกติเหมือนวันทำงาน
  // แต่ "ค่าอาหาร OT" (mealot) นับเฉพาะวันทำงานปกติที่มี OT เท่านั้น ไม่รวมวันหยุด-ทำ OT
  // "ค่าอาหาร OT วันหยุด" (mealotHoliday) แยกต่างหาก นับเฉพาะวันหยุด-ทำ OT ที่มี OT2 และ/หรือ OT3
  const mealBaht = (workDays+offOtDays+vacHalfDays)*r.meal, mealotBaht = otDays*r.mealot, mealotHolidayBaht = otHolidayDays*r.mealot;
  const carBaht = carDays*r.car, motoBaht = motoDays*r.moto;
  const income = {
    salary:ex.salary, baseWage:ex.baseWage, col:ex.col, ot15:ot15baht, ot2:ot2baht, ot3:ot3baht,
    shift:ex.shift, diligence:ex.diligence, meal:mealBaht, mealot:mealotBaht, mealotHoliday:mealotHolidayBaht, veCar:carBaht, veMoto:motoBaht, car:ex.car,
    other2:ex.other2, other3:ex.other3
  };
  const gross = Object.values(income).reduce((a,b)=>a+b,0);
  const deductions = ex.tax+ex.sso+ex.fund+ex.kss;
  const net = gross-deductions;
  return {income, gross, deductions, net, workDays, otDays, otHolidayDays, ot15Hours, ot2Hours, ot3Hours, offDays, vacDays, persDays, offOtDays, vacHalfDays};
}

function fmt(n){ return Math.round(n).toLocaleString('en-US'); }

function renderTabs(){
  const t = document.getElementById('tabs');
  t.innerHTML = '';
  for(let m=0;m<12;m++){
    const b = document.createElement('button');
    b.className = 'tab' + (activeTab===m ? ' active' : '');
    b.textContent = MONTH_TH[m];
    b.onclick = ()=>{ activeTab=m; render(); };
    t.appendChild(b);
  }
  const ov = document.createElement('button');
  ov.className = 'tab overview' + (activeTab==='overview' ? ' active' : '');
  ov.textContent = 'ภาพรวมทั้งปี';
  ov.onclick = ()=>{ activeTab='overview'; render(); };
  t.appendChild(ov);
}

    const canOt = (dstate.type==='work' || dstate.type==='off_ot');

        <input type="number" step="0.1" min="0" class="otinput" data-key="${key}" data-tier="ot2" value="${dstate.ot2 ? dstate.ot2 : ''}" placeholder="2x" title="ชม. OT 2 เท่า" ${!canOt||(!isOffOt && activeTier && activeTier!=='ot2')?'disabled':''}>

      </div>
    `;

  });
  grid.querySelectorAll('.typesel').forEach(sel=>{
    sel.onchange = e=>{
      const key = e.target.dataset.key;
      const d = state.months[m].days[key];
      d.type = e.target.value;
      if(d.type!=='work' && d.type!=='off_ot'){ d.ot15 = 0; d.ot2 = 0; d.ot3 = 0; }
      else if(d.type==='off_ot'){ d.ot15 = 0; } // วันหยุด-ทำ OT ไม่ใช้ tier 1.5 เท่า
      save(); renderMonth(m); attachRateHandlers();
    };
  });
  grid.querySelectorAll('.vehiclesel').forEach(sel=>{
    sel.onchange = e=>{
      const key = e.target.dataset.key;
      const d = state.months[m].days[key];
      d.vehicle = e.target.value;
      save();
      renderStampsAndBars(m);
    };
  });
  grid.querySelectorAll('.otinput').forEach(inp=>{
    inp.oninput = e=>{
      const key = e.target.dataset.key;
      const tier = e.target.dataset.tier;
      const val = parseFloat(e.target.value)||0;
      const d = state.months[m].days[key];
      d[tier] = val;
      const siblings = e.target.closest('.otgrid').querySelectorAll('.otinput');
      const isOffOt = d.type==='off_ot';
      if(isOffOt && (tier==='ot2' || tier==='ot3')){
        // วันหยุด-ทำ OT: ใส่ OT2 และ OT3 พร้อมกันได้ ไม่ต้องล้างค่ากันเอง
      } else if(val>0){
        siblings.forEach(o=>{
          if(o.dataset.tier!==tier){ d[o.dataset.tier] = 0; o.value=''; o.disabled = true; }
        });
      } else {
        siblings.forEach(o=>{ if(o.dataset.tier!==tier) o.disabled = false; });
      }
      save();
      renderStampsAndBars(m); // lightweight refresh without losing focus
    };
  });

  renderStampsAndBars(m);
  renderExtraFields(m);
}

function renderDonuts(m){
  const c = calcMonth(m);
  const g = c.gross, d = c.deductions, net = c.net;
  const donutMoney = document.getElementById('donutMoney');
  if(donutMoney){
    const dedDeg = g>0 ? (d/g*360) : 0;
    donutMoney.style.background = g>0
      ? `conic-gradient(var(--coral) 0deg ${dedDeg.toFixed(1)}deg, var(--teal) ${dedDeg.toFixed(1)}deg 360deg)`
      : 'var(--panel-2)';
    document.getElementById('donutMoneyPct').textContent = '฿'+fmt(g);
    document.getElementById('donutMoneyLegend').innerHTML = `
      <div><span class="swatch" style="background:var(--teal)"></span> สุทธิ ฿${fmt(net)}</div>
      <div><span class="swatch" style="background:var(--coral)"></span> รายจ่าย (หัก) ฿${fmt(d)}</div>
    `;
  }

  const donutDays = document.getElementById('donutDays');
  if(donutDays){
    const work = c.workDays + c.offOtDays; // นับวันหยุด-ทำOT รวมกับวันทำงาน (มาทำงานจริง)
    const off = c.offDays;
    const vac = c.vacDays + c.vacHalfDays*0.5;
    const pers = c.persDays;
    const totDays = work + off + vac + pers;
    if(totDays>0){
      const dWork = work/totDays*360;
      const dOff = dWork + off/totDays*360;
      const dVac = dOff + vac/totDays*360;
      donutDays.style.background = `conic-gradient(var(--gold) 0deg ${dWork.toFixed(1)}deg, var(--paper-dim) ${dWork.toFixed(1)}deg ${dOff.toFixed(1)}deg, var(--teal) ${dOff.toFixed(1)}deg ${dVac.toFixed(1)}deg, var(--coral) ${dVac.toFixed(1)}deg 360deg)`;
    } else {
      donutDays.style.background = 'var(--panel-2)';
    }
    document.getElementById('donutDaysTotal').textContent = totDays.toFixed(1);
    document.getElementById('donutDaysLegend').innerHTML = `
      <div><span class="swatch" style="background:var(--gold)"></span> ทำงาน ${c.workDays} วัน (+หยุด-ทำOT ${c.offOtDays} วัน)</div>
      <div><span class="swatch" style="background:var(--paper-dim)"></span> หยุด ${c.offDays} วัน</div>
      <div><span class="swatch" style="background:var(--teal)"></span> พักร้อน ${c.vacDays} วัน (+ครึ่งวัน ${c.vacHalfDays} วัน)</div>
      <div><span class="swatch" style="background:var(--coral)"></span> ลากิจ ${c.persDays} วัน</div>
    `;
  }

  const totOT = c.ot15Hours+c.ot2Hours+c.ot3Hours;
  const donutOT = document.getElementById('donutOT');
  if(donutOT){
    if(totOT>0){
      const d15 = c.ot15Hours/totOT*360, d2 = c.ot2Hours/totOT*360;
      donutOT.style.background = `conic-gradient(var(--gold) 0deg ${d15.toFixed(1)}deg, var(--teal) ${d15.toFixed(1)}deg ${(d15+d2).toFixed(1)}deg, var(--coral) ${(d15+d2).toFixed(1)}deg 360deg)`;
    } else {
      donutOT.style.background = 'var(--panel-2)';
    }
    document.getElementById('donutOTTotal').textContent = totOT.toFixed(1);
    document.getElementById('donutOTLegend').innerHTML = `
      <div><span class="swatch" style="background:var(--gold)"></span> OT 1.5x — ${c.ot15Hours.toFixed(1)} ชม.</div>
      <div><span class="swatch" style="background:var(--teal)"></span> OT 2x — ${c.ot2Hours.toFixed(1)} ชม.</div>
      <div><span class="swatch" style="background:var(--coral)"></span> OT 3x — ${c.ot3Hours.toFixed(1)} ชม.</div>
    `;
  }
}

function renderStampsAndBars(m){
  const c = calcMonth(m);
  document.querySelectorAll('.stamp.gross .num')[0].textContent = `฿${fmt(c.gross)}`;
  document.querySelectorAll('.stamp.ded .num')[0].textContent = `฿${fmt(c.deductions)}`;
  document.querySelectorAll('.stamp.net .num')[0].textContent = `฿${fmt(c.net)}`;
  renderDonuts(m);
  document.querySelector('.daycounts b')?.parentElement; // no-op guard

  const incRows = [
    ['เงินเดือน', c.income.salary], ['ค่าระดับ', c.income.baseWage], ['ค่าครองชีพ', c.income.col],
    ['OT 1.5', c.income.ot15], ['OT 2', c.income.ot2], ['OT 3', c.income.ot3],
    ['ค่ากะ', c.income.shift], ['เบี้ยขยัน', c.income.diligence],
    ['ค่าอาหาร', c.income.meal], ['ค่าอาหาร OT', c.income.mealot], ['ค่าอาหาร OT วันหยุด', c.income.mealotHoliday],
    ['ค่ารถยนต์', c.income.veCar], ['ค่ามอเตอร์ไซค์', c.income.veMoto], ['อื่นๆ', c.income.car],
    ['อื่นๆ2', c.income.other2], ['อื่นๆ3', c.income.other3]
  ].filter(r=>r[1]>0);
  const maxInc = Math.max(...incRows.map(r=>r[1]), 1);
  const incWrap = document.getElementById('incomeBars');
  if(incWrap){
    incWrap.innerHTML = incRows.map(r=>`
      <div class="bar-row"><div class="top"><span>${r[0]}</span><span class="amt">฿${fmt(r[1])}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(r[1]/maxInc*100).toFixed(1)}%;background:var(--gold)"></div></div></div>
    `).join('');
  }
  const ex = state.months[m].extra;
  const dedRows = [['ภาษี',ex.tax],['ประกันสังคม',ex.sso],['กองทุนฯ',ex.fund],['กสส.',ex.kss]].filter(r=>r[1]>0);
  const maxDed = Math.max(...dedRows.map(r=>r[1]),1);
  const dedWrap = document.getElementById('deductBars');
  if(dedWrap){
    dedWrap.innerHTML = dedRows.length ? dedRows.map(r=>`
      <div class="bar-row"><div class="top"><span>${r[0]}</span><span class="amt">฿${fmt(r[1])}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(r[1]/maxDed*100).toFixed(1)}%;background:var(--coral)"></div></div></div>
    `).join('') : `<p style="color:var(--paper-dim);font-size:12px">ยังไม่มีรายการหัก</p>`;
  }
}

function renderExtraFields(m){
  const ex = state.months[m].extra;
  const incFieldDefs = [
    ['salary','เงินเดือน'],['baseWage','ค่าระดับ'],['col','ค่าครองชีพ'],
    ['shift','ค่ากะ'],['diligence','เบี้ยขยัน'],['car','อื่นๆ'],['other2','อื่นๆ2'],['other3','อื่นๆ3']
  ];
  const incF = document.getElementById('incomeFields');
  incF.innerHTML = incFieldDefs.map(([k,label])=>`
    <div class="field"><label>${label}</label><input type="number" step="1" data-field="${k}" value="${ex[k]}"></div>
  `).join('');
  incF.querySelectorAll('input').forEach(inp=>{
    inp.oninput = e=>{ ex[e.target.dataset.field] = parseFloat(e.target.value)||0; save(); renderStampsAndBars(m); };
  });

  const dedFieldDefs = [['tax','ภาษี'],['sso','ประกันสังคม'],['fund','กองทุนฯ'],['kss','กสส.']];
  const dedF = document.getElementById('deductFields');
  dedF.innerHTML = dedFieldDefs.map(([k,label])=>`
    <div class="field"><label>${label}</label><input type="number" step="1" data-field="${k}" value="${ex[k]}"></div>
  `).join('');
  dedF.querySelectorAll('input').forEach(inp=>{
    inp.oninput = e=>{ ex[e.target.dataset.field] = parseFloat(e.target.value)||0; save(); renderStampsAndBars(m); };
  });
}

function renderOverview(){
  let totG=0, totD=0, totN=0;
  const rows = [];
  for(let m=0;m<12;m++){
    const c = calcMonth(m);
    totG+=c.gross; totD+=c.deductions; totN+=c.net;
    rows.push({m, ...c});
  }
  const maxG = Math.max(...rows.map(r=>r.gross),1);

  let html = `
    <div class="hero">
      <div class="stamp gross"><div class="label">รายรับรวมทั้งปี</div><div class="num">฿${fmt(totG)}</div></div>
      <div class="stamp ded"><div class="label">รายการหักรวมทั้งปี</div><div class="num">฿${fmt(totD)}</div></div>
      <div class="stamp net"><div class="label">เงินสุทธิรวมทั้งปี</div><div class="num">฿${fmt(totN)}</div></div>
    </div>

    <div class="section-title">รายรับ vs รายการหัก รายเดือน <span class="hint">฿ ทอง=รายรับ · แดง=หัก</span></div>
    <div class="ybar-wrap">
      ${rows.map(r=>`
        <div class="ybar-col">
          <div class="ybar-pair">
            <div class="ybar g" style="height:${(r.gross/maxG*140).toFixed(0)}px" title="รายรับ ฿${fmt(r.gross)}"></div>
            <div class="ybar d" style="height:${(r.deductions/maxG*140).toFixed(0)}px" title="หัก ฿${fmt(r.deductions)}"></div>
          </div>
          <div class="ybar-lbl">${MONTH_TH[r.m]}</div>
        </div>
      `).join('')}
    </div>

    <div class="section-title">ตารางสรุปรายเดือน</div>
    <table>
      <thead><tr><th>งวดเริ่มเดือน</th><th>รายรับ</th><th>รายการหัก</th><th>สุทธิ</th><th>OT 1.5</th><th>OT 2</th><th>OT 3</th><th>วันทำงาน</th><th>หยุด-ทำOT</th><th>พักร้อน</th><th>พักร้อนครึ่งวัน</th><th>ลากิจ</th></tr></thead>
      <tbody>
        ${rows.map(r=>`
          <tr>
            <td>${MONTH_TH[r.m]}</td>
            <td>฿${fmt(r.gross)}</td>
            <td>฿${fmt(r.deductions)}</td>
            <td>฿${fmt(r.net)}</td>
            <td>${r.ot15Hours.toFixed(1)}</td>
            <td>${r.ot2Hours.toFixed(1)}</td>
            <td>${r.ot3Hours.toFixed(1)}</td>
            <td>${r.workDays}</td>
            <td>${r.offOtDays}</td>
            <td>${r.vacDays}</td>
            <td>${r.vacHalfDays}</td>
            <td>${r.persDays}</td>
          </tr>
        `).join('')}
        <tr class="total">
          <td>รวมทั้งปี</td><td>฿${fmt(totG)}</td><td>฿${fmt(totD)}</td><td>฿${fmt(totN)}</td>
          <td colspan="8"></td>
        </tr>
      </tbody>
    </table>
    <button class="reset-btn" id="exportYearBtn" style="border-color:var(--gold);color:var(--gold);margin-right:10px;">📄 ดาวน์โหลด PDF สรุปรวมทั้งปี (13 หน้า)</button>
    <button class="reset-btn" id="resetAll">ล้างข้อมูลทั้งหมด &amp; เริ่มใหม่</button>
  `;
  document.getElementById('content').innerHTML = html;
  document.getElementById('exportYearBtn').onclick = ()=>exportYearPDF();
  document.getElementById('resetAll').onclick = ()=>{
    if(confirm('ล้างข้อมูลทั้งหมดและกลับไปใช้ค่าเริ่มต้น?')){
      localStorage.removeItem(STORE_KEY);
      state = loadState();
      render();
    }
  };
}

/* ---------- PDF export (ดาวน์โหลดหน้าตาแบบที่แสดงผลจริง) ---------- */
function showExportOverlay(text){
  let el = document.getElementById('exportOverlay');
  if(!el){
    el = document.createElement('div');
    el.id = 'exportOverlay';
    el.style.cssText = 'position:fixed;inset:0;background:rgba(18,24,31,0.92);color:#eae4d8;display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono",monospace;font-size:14px;z-index:9999;text-align:center;padding:20px;';
    document.body.appendChild(el);
  }
  el.textContent = text;
  el.style.display = 'flex';
}
function hideExportOverlay(){
  const el = document.getElementById('exportOverlay');
  if(el) el.style.display = 'none';
}
function waitFrame(ms){ return new Promise(res=>setTimeout(res, ms)); }

async function captureNode(node){
  return await html2canvas(node, {backgroundColor:'#12181f', scale:2, useCORS:true});
}

function addCanvasAsPages(pdf, canvas, isFirstPageOverall){
  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();
  const imgWidth = pageWidth;
  const imgHeight = canvas.height * imgWidth / canvas.width;
  const imgData = canvas.toDataURL('image/jpeg', 0.92);
  let heightLeft = imgHeight;
  let position = 0;
  if(!isFirstPageOverall) pdf.addPage();
  pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
  heightLeft -= pageHeight;
  while(heightLeft > 0){
    position -= pageHeight;
    pdf.addPage();
    pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
  }
}

function insertPdfHeader(text){
  const content = document.getElementById('content');
  const h = document.createElement('div');
  h.id = 'pdfHeaderTemp';
  h.style.cssText = 'font-family:"Noto Serif Thai",serif;font-weight:700;font-size:22px;color:#eae4d8;margin-bottom:16px;border-bottom:1px solid rgba(234,228,216,0.14);padding-bottom:10px;';
  h.textContent = text;
  content.prepend(h);
  return h;
}
function removePdfHeader(){
  const h = document.getElementById('pdfHeaderTemp');
  if(h) h.remove();
}

async function exportMonthPDF(m){
  const prevTab = activeTab;
  try{
    showExportOverlay('กำลังสร้าง PDF ของเดือน '+MONTH_TH[m]+'...');
    if(activeTab !== m){ activeTab = m; render(); }
    await waitFrame(200);
    const labelStart = `16 ${MONTH_TH[m]}`, labelEnd = `15 ${MONTH_TH[(m+1)%12]}`;
    insertPdfHeader(`สรุปค่าแรง OT — งวด ${labelStart} – ${labelEnd} ${YEAR}`);
    await waitFrame(50);
    const canvas = await captureNode(document.getElementById('content'));
    removePdfHeader();
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({unit:'pt', format:'a4'});
    addCanvasAsPages(pdf, canvas, true);
    pdf.save(`OT-${MONTH_TH[m]}-${YEAR}.pdf`);
  }catch(e){
    console.error(e);
    alert('สร้าง PDF ไม่สำเร็จ: '+e.message);
  }finally{
    removePdfHeader();
    if(prevTab !== activeTab){ activeTab = prevTab; render(); }
    hideExportOverlay();
  }
}

async function exportYearPDF(){
  const prevTab = activeTab;
  try{
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({unit:'pt', format:'a4'});
    let first = true;

    showExportOverlay('กำลังสร้าง PDF หน้าภาพรวมทั้งปี...');
    activeTab = 'overview'; render();
    await waitFrame(200);
    insertPdfHeader(`สรุปค่าแรง OT รายปี ${YEAR} — ภาพรวมทั้งปี`);
    await waitFrame(50);
    let canvas = await captureNode(document.getElementById('content'));
    removePdfHeader();
    addCanvasAsPages(pdf, canvas, first); first = false;

    for(let m=0; m<12; m++){
      showExportOverlay(`กำลังสร้าง PDF เดือน ${MONTH_TH[m]}... (${m+1}/12)`);
      activeTab = m; render();
      await waitFrame(200);
      const labelStart = `16 ${MONTH_TH[m]}`, labelEnd = `15 ${MONTH_TH[(m+1)%12]}`;
      insertPdfHeader(`สรุปค่าแรง OT — งวด ${labelStart} – ${labelEnd} ${YEAR}`);
      await waitFrame(50);
      canvas = await captureNode(document.getElementById('content'));
      removePdfHeader();
      addCanvasAsPages(pdf, canvas, first); first = false;
    }
    pdf.save(`OT-สรุปรวมทั้งปี-${YEAR}.pdf`);
  }catch(e){
    console.error(e);
    alert('สร้าง PDF ไม่สำเร็จ: '+e.message);
  }finally{
    removePdfHeader();
    activeTab = prevTab; render();
    hideExportOverlay();
  }
}

function attachRateHandlers(){
  if(activeTab==='overview') return; // ภาพรวมทั้งปีไม่มีอัตราให้แก้ (แต่ละเดือนตั้งแยกกัน)
  const ms = state.months[activeTab];
  const map = {r_ot15:'ot15', r_ot2:'ot2', r_ot3:'ot3', r_meal:'meal', r_mealot:'mealot', r_moto:'moto', r_car:'car'};
  Object.entries(map).forEach(([id,key])=>{
    const el = document.getElementById(id);
    if(!el) return;
    el.value = ms.rates[key];
    el.oninput = ()=>{ ms.rates[key] = parseFloat(el.value)||0; save(); renderStampsAndBars(activeTab); };
  });
}

function render(){
  renderTabs();
  try{
    if(activeTab==='overview') renderOverview();
    else renderMonth(activeTab);
    attachRateHandlers();
  }catch(e){
    console.error(e);
    document.getElementById('content').innerHTML =
      `<div style="padding:20px;border:1px solid var(--coral);border-radius:6px;color:var(--coral);font-size:13px">
        เกิดข้อผิดพลาดตอนแสดงผลเดือนนี้ (${e.message}) — ข้อมูลของเดือนนี้อาจไม่ครบ ลองกด "ล้างข้อมูลทั้งหมด" ที่แท็บภาพรวมทั้งปี หรือแจ้งผู้พัฒนา
      </div>`;
  }
}

attachSyncHandlers();
render();
if(getSyncUrl()) pullRemoteOnLoad();
</script>
